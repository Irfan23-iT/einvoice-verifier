spring.application.name=einvoice-verifier

server.port=8080

# In-memory H2 Database
spring.datasource.url=jdbc:h2:mem:einvoicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate auto-creates SQL tables (dialect is auto-detected for H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# CSV batch upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Error responses are owned by GlobalExceptionHandler so every failure keeps a predictable shape

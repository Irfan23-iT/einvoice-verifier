spring.application.name=einvoice-verifier

server.port=8080

# In-memory H2 Database, persisted to disk so the audit trail survives restarts
spring.datasource.url=jdbc:h2:file:./data/einvoicedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate auto-creates SQL tables (dialect is auto-detected for H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# CSV batch upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------------------
# Business rules. Every value below is read by EinvoiceProperties and can be
# tuned to match production specifications without a code change.
# ---------------------------------------------------------------------------

# Buyer TIN: mandatory Malaysian Tax Identification Number format
einvoice.rules.tin-pattern=^[0-9]{12}$

# Buyer identity: BRN (SSM company) or NRIC (individual MyKad), no dashes
einvoice.rules.buyer-id-pattern=^[0-9]{12}$

# Approved Malaysian service tax rates
einvoice.rules.allowed-sst-rates=0.00,0.06,0.08

# Maximum data rows accepted in a single CSV upload
einvoice.rules.max-batch-rows=5000

# Mock LHDN MyInvois gateway
einvoice.gateway.uuid-prefix=LHDN-MYINVOIS-
einvoice.gateway.qr-base-url=https://myinvois.hasil.gov.my/taxpayer/validate/

# Error responses are owned by GlobalExceptionHandler so every failure keeps a predictable shape
